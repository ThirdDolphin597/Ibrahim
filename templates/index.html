<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/logo.svg') }}">
    <title>Ibrahim Ahmad</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.svg') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script type="text/javascript">
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "tjhhlqqz7r");
    </script>
</head>
<body class="home-page">
    <!-- Header and Navigation -->
    <header class="header">
        <div class="nav-container">
            <div class="nav-brand">
                <a href="{{ url_for('index') }}" class="brand-link">Ibrahim Ahmad</a>
            </div>
            <div class="nav-center">
                <nav class="nav-links">
                    <a href="{{ url_for('blog') }}" class="nav-link">Blog</a>
                    <a href="{{ url_for('about') }}" class="nav-link">About</a>
                    <a href="https://ibrahimphotography.pixieset.com/" class="nav-link" target="_blank">Photography</a>
                </nav>
            </div>
            <div class="nav-right">
                <button class="theme-toggle-container" id="themeToggle" type="button" aria-label="Toggle theme">
                    <span class="theme-toggle-dot"></span>
                </button>
            </div>
        </div>
    </header>

    <!-- Full-Width Hero Image Section -->
    <section class="hero-banner">
        <div class="hero-banner-overlay"></div>
        <div class="hero-banner-content">
            <p class="hero-banner-intro">HEY, I'M</p>
            <h1 class="hero-banner-name">
                <span class="first-name">IBRAHIM</span>
                <span class="last-name">AHMAD</span>
            </h1>
            <p class="hero-banner-subtitle" aria-label="I'm also a photographer, a mountain biker, a hiker, a mechanical engineer, and a tech enthusiast.">
                I'm also <span class="hero-banner-typed" id="heroTypedText" aria-hidden="true"></span><span class="hero-banner-cursor" aria-hidden="true"></span>
            </p>
        </div>
    </section>

    <!-- Skills Section -->
    <section class="skills-section">
        <div class="skills-container">
            <h2 class="skills-title">My Skills</h2>
            <div class="skills-grid-icons">
                <div class="skill-item">
                    <div class="skill-logo">
                        <img src="https://static.macupdate.com/products/53938/m/fusion-360-logo.png?v=1670227262" alt="Fusion 360">
                    </div>
                    <p class="skill-label">Fusion 360</p>
                </div>
                <div class="skill-item">
                    <div class="skill-logo skill-logo--copilot">
                        <img src="https://uxwing.com/wp-content/themes/uxwing/download/brands-and-social-media/github-copilot-icon.png" alt="GitHub Copilot">
                    </div>
                    <p class="skill-label">Copilot</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Experience Section -->
    <section class="experience-section" id="experience">
        <div class="experience-container">
            <div class="experience-layout">
                <div class="wireframe-viewer" id="sunkWireframe">
                    <canvas
                        id="sunkWireframeCanvas"
                        data-model="{{ url_for('static', filename='models/sunk-camera-mount.wire') }}"
                        aria-label="Interactive wireframe model of the Sunk Robotics camera mount"
                    ></canvas>
                    <p class="wireframe-status" aria-live="polite">LOADING MODEL</p>
                </div>

                <article class="experience-copy">
                    <p class="experience-label">EXPERIENCE</p>
                    <h2>Sunk Robotics</h2>
                    <p class="experience-role">Mechanical Engineer · 2024 - Present</p>
                </article>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="py-3 mt-5">
        <div class="container text-center">
            <div class="d-flex justify-content-center gap-4 mb-2">
                <a href="https://github.com/ThirdDolphin597" target="_blank" class="text-decoration-none text-secondary footer-social-icon" title="GitHub">
                    <i class="bi bi-github fs-4"></i>
                </a>
                    <a href="https://www.linkedin.com/in/ibrahim-ahmad-9951792aa" target="_blank" class="text-decoration-none text-secondary footer-social-icon" title="LinkedIn">
                        <i class="bi bi-linkedin fs-4"></i>
                    </a>
                <a href="mailto:ibazeemi@gmail.com" class="text-decoration-none text-secondary footer-social-icon" title="Email">
                    <i class="bi bi-envelope fs-4"></i>
                </a>
            </div>
            <small class="text-muted">© 2025 Ibrahim Ahmad. All Rights Reserved.</small>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/themeToggle.js') }}"></script>
    <script src="{{ url_for('static', filename='js/experienceWireframe.js') }}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const typedText = document.getElementById('heroTypedText');

            if (typedText) {
                const phrases = [
                    'a photographer',
                    'a mountain biker',
                    'a hiker',
                    'a mechanical engineer',
                    'a tech enthusiast'
                ];

                if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                    typedText.textContent = phrases[0];
                } else {
                    let phraseIndex = 0;
                    let characterIndex = 0;
                    let isDeleting = false;

                    const typeNextCharacter = () => {
                        const phrase = phrases[phraseIndex];
                        typedText.textContent = phrase.slice(0, characterIndex);

                        if (!isDeleting && characterIndex < phrase.length) {
                            characterIndex += 1;
                            window.setTimeout(typeNextCharacter, 85);
                            return;
                        }

                        if (!isDeleting) {
                            isDeleting = true;
                            window.setTimeout(typeNextCharacter, 1600);
                            return;
                        }

                        if (characterIndex > 0) {
                            characterIndex -= 1;
                            window.setTimeout(typeNextCharacter, 45);
                            return;
                        }

                        isDeleting = false;
                        phraseIndex = (phraseIndex + 1) % phrases.length;
                        window.setTimeout(typeNextCharacter, 300);
                    };

                    typeNextCharacter();
                }
            }

            // Navbar scroll effect
            const header = document.querySelector('.header');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 100) {
                    header.classList.add('scrolled');
                } else {
                    header.classList.remove('scrolled');
                }
            });
        });
    </script>
</body>
</html>
